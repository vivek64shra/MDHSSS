<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sportSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="65%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldCup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="spShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Crisp Daylight Sky -->
  <rect width="800" height="270" fill="url(#sportSky)"/>
  <circle cx="660" cy="78" r="34" fill="#fef08a"/>
  <path d="M100,88 Q122,62 156,74 Q182,56 212,76 Q230,90 212,102 L106,102 Q90,100 100,88 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M440,70 Q458,50 486,60 Q506,48 530,62 Q542,74 526,84 L446,84 Q434,82 440,70 Z" fill="#ffffff" opacity="0.8"/>

  <!-- Background Trees & Campus Pavilion -->
  <g fill="#16a34a" opacity="0.75">
    <circle cx="64" cy="242" r="44"/><circle cx="122" cy="252" r="36"/><circle cx="176" cy="258" r="28"/>
    <circle cx="634" cy="252" r="36"/><circle cx="696" cy="242" r="44"/><circle cx="758" cy="250" r="38"/>
  </g>
  <rect x="270" y="218" width="260" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="256,220 400,192 544,220" fill="#0369a1"/>

  <!-- Lush Green Stadium Turf & Running Track -->
  <rect x="0" y="260" width="800" height="240" fill="url(#turf)"/>
  <!-- Alternating Mowed Turf Stripes -->
  <g fill="#16a34a" opacity="0.32">
    <rect x="0" y="260" width="800" height="32"/>
    <rect x="0" y="324" width="800" height="34"/>
    <rect x="0" y="392" width="800" height="38"/>
  </g>
  <!-- Crisp Chalk Field Markings -->
  <ellipse cx="400" cy="402" rx="320" ry="74" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.82"/>
  <ellipse cx="400" cy="402" rx="276" ry="58" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8" opacity="0.65"/>

  <!-- Left: Cricket Stumps & Bat -->
  <g filter="url(#spShadow)">
    <rect x="134" y="294" width="9" height="96" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
    <rect x="150" y="294" width="9" height="96" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
    <rect x="166" y="294" width="9" height="96" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
    <rect x="132" y="288" width="22" height="7" rx="3" fill="#fef08a"/>
    <rect x="155" y="288" width="22" height="7" rx="3" fill="#fef08a"/>
    <!-- Cricket Bat leaned -->
    <g transform="rotate(20 218 350)">
      <rect x="212" y="254" width="12" height="44" rx="4" fill="#1e293b"/>
      <rect x="200" y="296" width="36" height="98" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
      <line x1="218" y1="300" x2="218" y2="390" stroke="#d97706" stroke-width="1.5"/>
    </g>
    <!-- Red Leather Cricket Ball -->
    <circle cx="242" cy="404" r="14" fill="#dc2626"/>
    <path d="M232,396 Q242,404 252,412" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 2"/>
  </g>

  <!-- Center: Championship Gold Trophy on Winner Podium -->
  <g filter="url(#spShadow)">
    <!-- Podium -->
    <rect x="348" y="388" width="104" height="58" rx="6" fill="#0369a1"/>
    <rect x="356" y="396" width="88" height="42" rx="4" fill="#0284c7"/>
    <text x="400" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">1st</text>
    <!-- Cup Handles -->
    <path d="M358,284 C328,284 328,334 366,336" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <path d="M442,284 C472,284 472,334 434,336" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <!-- Cup Body -->
    <path d="M358,274 L442,274 L432,338 Q400,362 368,338 Z" fill="url(#goldCup)"/>
    <rect x="392" y="352" width="16" height="24" fill="#d97706"/>
    <rect x="372" y="374" width="56" height="14" rx="4" fill="#92400e"/>
    <!-- Star Emblem -->
    <polygon points="400,290 405,304 420,304 408,312 413,326 400,318 387,326 392,312 380,304 395,304" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- Right: Football & Volleyball -->
  <g filter="url(#spShadow)">
    <!-- Classic Football -->
    <circle cx="584" cy="390" r="34" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="584,374 598,384 593,400 575,400 570,384" fill="#0f172a"/>
    <line x1="584" y1="374" x2="584" y2="356" stroke="#0f172a" stroke-width="2"/>
    <line x1="598" y1="384" x2="616" y2="378" stroke="#0f172a" stroke-width="2"/>
    <line x1="593" y1="400" x2="604" y2="416" stroke="#0f172a" stroke-width="2"/>
    <line x1="575" y1="400" x2="564" y2="416" stroke="#0f172a" stroke-width="2"/>
    <line x1="570" y1="384" x2="552" y2="378" stroke="#0f172a" stroke-width="2"/>

    <!-- Volleyball -->
    <circle cx="672" cy="348" r="28" fill="#fef08a" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M648,334 Q672,348 696,334" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M646,356 Q672,344 698,356" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M672,320 Q662,348 672,376" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  </g>
</svg>
