<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="busSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="62%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="busGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="busShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clear Morning Sky -->
  <rect width="800" height="310" fill="url(#busSky)"/>
  <circle cx="116" cy="84" r="34" fill="#fef08a"/>
  <path d="M220,86 Q240,62 272,72 Q296,54 326,74 Q342,88 324,100 L226,100 Q212,98 220,86 Z" fill="#ffffff" opacity="0.88"/>
  <path d="M540,76 Q560,54 590,64 Q612,50 638,66 Q652,78 636,90 L546,90 Q532,88 540,76 Z" fill="#ffffff" opacity="0.82"/>

  <!-- Scenic Green Hills & Roadside Trees -->
  <path d="M0,310 Q180,248 390,292 T800,276 L800,360 L0,360 Z" fill="#4ade80"/>
  <g>
    <rect x="64" y="256" width="10" height="68" fill="#78350f"/>
    <circle cx="69" cy="242" r="30" fill="#15803d"/><circle cx="52" cy="256" r="22" fill="#16a34a"/>
    <rect x="716" y="250" width="10" height="74" fill="#78350f"/>
    <circle cx="721" cy="236" r="32" fill="#15803d"/><circle cx="740" cy="252" r="22" fill="#22c55e"/>
  </g>

  <!-- Smooth Highway Road -->
  <rect x="0" y="346" width="800" height="154" fill="#334155"/>
  <rect x="0" y="344" width="800" height="8" fill="#cbd5e1"/>
  <rect x="0" y="478" width="800" height="22" fill="#16a34a"/>
  <!-- Road Dashes -->
  <g fill="#f8fafc" opacity="0.85">
    <rect x="34" y="422" width="76" height="8" rx="4"/>
    <rect x="172" y="422" width="76" height="8" rx="4"/>
    <rect x="310" y="422" width="76" height="8" rx="4"/>
    <rect x="448" y="422" width="76" height="8" rx="4"/>
    <rect x="586" y="422" width="76" height="8" rx="4"/>
    <rect x="724" y="422" width="60" height="8" rx="4"/>
  </g>

  <!-- GPS Live Signal Arcs Above Bus Roof -->
  <g transform="translate(396, 134)" fill="none" stroke="#0284c7" stroke-linecap="round">
    <circle cx="0" cy="18" r="5" fill="#0284c7" stroke="none"/>
    <path d="M-16,10 A20,20 0 0,1 16,10" stroke-width="3.5"/>
    <path d="M-28,0 A36,36 0 0,1 28,0" stroke-width="3" opacity="0.72"/>
    <path d="M-40,-10 A52,52 0 0,1 40,-10" stroke-width="2.5" opacity="0.45"/>
  </g>

  <!-- Ground Contact Shadow -->
  <ellipse cx="404" cy="402" rx="270" ry="16" fill="#0f172a" opacity="0.35"/>

  <!-- Iconic MDHSSS Golden Yellow School Bus -->
  <g filter="url(#busShadow)">
    <!-- Roof AC & GPS Pod -->
    <rect x="348" y="162" width="110" height="16" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Main Chassis -->
    <path d="M138,186 Q138,172 154,172 L608,172 Q636,172 648,198 L668,266 Q676,282 676,304 L676,364 Q676,378 660,378 L150,378 Q138,378 138,364 Z" fill="url(#busBody)" stroke="#ca8a04" stroke-width="2.5"/>

    <!-- Royal Blue School Branding Stripe -->
    <rect x="138" y="286" width="538" height="32" fill="#0369a1"/>
    <rect x="138" y="318" width="538" height="5" fill="#ffffff"/>
    <text x="382" y="307" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.4">MDHSSS • SEMARIYA SCHOOL BUS</text>

    <!-- Passenger Windows Row -->
    <g fill="url(#busGlass)" stroke="#0f172a" stroke-width="2.5">
      <rect x="162" y="198" width="68" height="72" rx="8"/>
      <rect x="242" y="198" width="68" height="72" rx="8"/>
      <rect x="322" y="198" width="68" height="72" rx="8"/>
      <rect x="402" y="198" width="68" height="72" rx="8"/>
      <rect x="482" y="198" width="68" height="72" rx="8"/>
    </g>
    <!-- Front Panoramic Windshield & Door -->
    <path d="M566,198 L630,198 Q640,198 644,212 L658,270 L566,270 Z" fill="url(#busGlass)" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="566" y="276" width="44" height="96" rx="4" fill="#fef08a" stroke="#0f172a" stroke-width="2"/>
    <rect x="572" y="284" width="32" height="38" rx="3" fill="#bae6fd"/>

    <!-- Headlight, Taillight & Bumper -->
    <rect x="656" y="330" width="20" height="18" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="138" y="330" width="14" height="22" rx="3" fill="#dc2626"/>
    <rect x="658" y="362" width="26" height="14" rx="4" fill="#1e293b"/>
    <rect x="128" y="362" width="22" height="14" rx="4" fill="#1e293b"/>

    <!-- Heavy-Duty Wheels -->
    <g>
      <circle cx="242" cy="378" r="34" fill="#0f172a"/>
      <circle cx="242" cy="378" r="20" fill="#cbd5e1"/>
      <circle cx="242" cy="378" r="8" fill="#475569"/>

      <circle cx="562" cy="378" r="34" fill="#0f172a"/>
      <circle cx="562" cy="378" r="20" fill="#cbd5e1"/>
      <circle cx="562" cy="378" r="8" fill="#475569"/>
    </g>
  </g>
</svg>
