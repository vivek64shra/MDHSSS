<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="woodDesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Classroom Wall & Floor -->
  <rect width="800" height="360" fill="url(#wallBg)"/>
  <rect x="0" y="360" width="800" height="140" fill="url(#floorGrad)"/>
  <rect x="0" y="352" width="800" height="12" fill="#94a3b8"/>

  <!-- Left Sunlit Window -->
  <rect x="34" y="64" width="112" height="186" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <rect x="44" y="74" width="92" height="166" rx="4" fill="#bae6fd"/>
  <polygon points="44,74 136,74 96,240 44,240" fill="#e0f2fe" opacity="0.65"/>
  <line x1="90" y1="74" x2="90" y2="240" stroke="#ffffff" stroke-width="4"/>
  <line x1="44" y1="156" x2="136" y2="156" stroke="#ffffff" stroke-width="4"/>

  <!-- Ceiling Projector & Light Beam -->
  <rect x="394" y="0" width="12" height="30" fill="#475569"/>
  <rect x="364" y="28" width="72" height="22" rx="6" fill="#1e293b"/>
  <circle cx="400" cy="39" r="6" fill="#38bdf8"/>
  <polygon points="392,50 408,50 580,104 220,104" fill="url(#beamGrad)"/>

  <!-- 4K Interactive Smart Board -->
  <g filter="url(#boardShadow)">
    <rect x="184" y="72" width="432" height="244" rx="14" fill="#1e293b"/>
    <rect x="196" y="84" width="408" height="214" rx="8" fill="url(#screenGrad)"/>
  </g>
  <!-- Smart Board Tray & Stylus -->
  <rect x="320" y="316" width="160" height="8" rx="4" fill="#64748b"/>
  <rect x="345" y="313" width="38" height="4" rx="2" fill="#38bdf8"/>
  <rect x="395" y="313" width="38" height="4" rx="2" fill="#f59e0b"/>

  <!-- Smart Board Content: Solar System & Geometry Diagram -->
  <g>
    <!-- Solar System Graphic Left -->
    <circle cx="305" cy="190" r="68" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55"/>
    <circle cx="305" cy="190" r="44" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
    <circle cx="305" cy="190" r="22" fill="#fbbf24"/>
    <circle cx="305" cy="190" r="28" fill="#fbbf24" opacity="0.22"/>
    <circle cx="349" cy="186" r="8" fill="#38bdf8"/>
    <circle cx="254" cy="144" r="10" fill="#fb7185"/>
    <circle cx="342" cy="248" r="7" fill="#4ade80"/>

    <!-- Graph & Formula Panel Right -->
    <rect x="406" y="106" width="176" height="170" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#7dd3fc" stroke-opacity="0.35"/>
    <text x="422" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#7dd3fc">SMART CLASS • 3D</text>
    <!-- Bar Chart -->
    <rect x="424" y="216" width="22" height="42" rx="4" fill="#38bdf8"/>
    <rect x="456" y="186" width="22" height="72" rx="4" fill="#4ade80"/>
    <rect x="488" y="162" width="22" height="96" rx="4" fill="#fbbf24"/>
    <rect x="520" y="146" width="22" height="112" rx="4" fill="#f472b6"/>
    <line x1="418" y1="258" x2="564" y2="258" stroke="#bae6fd" stroke-width="1.5"/>
  </g>

  <!-- Right Wall Educational Poster -->
  <rect x="646" y="88" width="116" height="148" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <rect x="658" y="102" width="92" height="18" rx="4" fill="#0284c7"/>
  <rect x="658" y="130" width="40" height="40" rx="6" fill="#fef3c7"/>
  <polygon points="678,136 692,162 664,162" fill="#f59e0b"/>
  <rect x="708" y="130" width="42" height="40" rx="6" fill="#dcfce7"/>
  <circle cx="729" cy="150" r="13" fill="#16a34a"/>
  <rect x="658" y="182" width="92" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="658" y="198" width="72" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="658" y="214" width="84" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Foreground Student Desks -->
  <g>
    <!-- Left Desk -->
    <rect x="78" y="386" width="186" height="16" rx="5" fill="url(#woodDesk)"/>
    <rect x="94" y="402" width="10" height="82" fill="#475569"/>
    <rect x="238" y="402" width="10" height="82" fill="#475569"/>
    <rect x="112" y="376" width="54" height="10" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="178" y="370" width="46" height="16" rx="3" fill="#0ea5e9"/>

    <!-- Center Desk -->
    <rect x="307" y="386" width="186" height="16" rx="5" fill="url(#woodDesk)"/>
    <rect x="323" y="402" width="10" height="82" fill="#475569"/>
    <rect x="467" y="402" width="10" height="82" fill="#475569"/>
    <rect x="342" y="375" width="60" height="11" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="414" y="373" width="44" height="13" rx="3" fill="#f59e0b"/>

    <!-- Right Desk -->
    <rect x="536" y="386" width="186" height="16" rx="5" fill="url(#woodDesk)"/>
    <rect x="552" y="402" width="10" height="82" fill="#475569"/>
    <rect x="696" y="402" width="10" height="82" fill="#475569"/>
    <rect x="572" y="376" width="52" height="10" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="638" y="371" width="48" height="15" rx="3" fill="#6366f1"/>
  </g>
</svg>
