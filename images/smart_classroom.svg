<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="classWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <!-- Background Classroom Wall -->
  <rect width="800" height="500" fill="url(#classWall)"/>
  <!-- Wooden Floor -->
  <rect x="0" y="360" width="800" height="140" fill="#fed7aa"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#fbd38d" stroke-width="2"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#fbd38d" stroke-width="2"/>
  
  <!-- Smart Digital Interactive Board -->
  <rect x="180" y="40" width="440" height="230" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="4"/>
  <rect x="195" y="55" width="410" height="200" rx="4" fill="url(#boardGrad)"/>
  
  <!-- Smart Board Content -->
  <text x="400" y="100" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">🎓 स्मार्ट क्लासरूम शिक्षण (Smart Class)</text>
  <text x="400" y="140" font-family="'Segoe UI', sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle">डिजिटल प्रोजेक्टर एवं 3D ऑडियो-विजुअल माध्यम</text>
  <path d="M 280,180 Q 340,150 400,200 T 520,170" fill="none" stroke="#4ade80" stroke-width="3"/>
  <circle cx="340" cy="165" r="5" fill="#fde047"/>
  <circle cx="460" cy="185" r="5" fill="#fde047"/>
  
  <!-- Teacher Podium / Desk -->
  <rect x="100" y="260" width="100" height="110" fill="url(#deskGrad)" rx="4"/>
  <rect x="90" y="250" width="120" height="15" fill="#b45309" rx="3"/>
  <rect x="120" y="225" width="45" height="25" fill="#475569" rx="2"/>
  
  <!-- Student Benches and Chairs -->
  <g fill="url(#deskGrad)">
    <rect x="180" y="330" width="180" height="40" rx="4"/>
    <rect x="440" y="330" width="180" height="40" rx="4"/>
    <rect x="120" y="410" width="240" height="50" rx="4"/>
    <rect x="440" y="410" width="240" height="50" rx="4"/>
  </g>
  <!-- Desk Legs -->
  <g stroke="#334155" stroke-width="4">
    <line x1="200" y1="370" x2="200" y2="400"/>
    <line x1="340" y1="370" x2="340" y2="400"/>
    <line x1="460" y1="370" x2="460" y2="400"/>
    <line x1="600" y1="370" x2="600" y2="400"/>
  </g>
  
  <!-- Books on Desks -->
  <rect x="220" y="320" width="30" height="10" fill="#ef4444" rx="2"/>
  <rect x="480" y="320" width="30" height="10" fill="#3b82f6" rx="2"/>
  <rect x="180" y="400" width="35" height="10" fill="#10b981" rx="2"/>
  <rect x="520" y="400" width="35" height="10" fill="#8b5cf6" rx="2"/>
  
  <!-- Bottom Caption Badge -->
  <rect x="30" y="430" width="370" height="45" rx="10" fill="rgba(15,23,42,0.85)"/>
  <text x="50" y="458" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🖥️ आधुनिक स्मार्ट क्लासरूम (Smart Classroom)</text>
</svg>
