<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="libWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="woodShelf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#libWall)"/>
  <rect x="0" y="380" width="800" height="120" fill="#fed7aa"/>

  <!-- Bookshelf Structure -->
  <rect x="100" y="80" width="600" height="280" fill="#b45309" stroke="#78350f" stroke-width="6" rx="4"/>
  <!-- Shelves -->
  <rect x="100" y="170" width="600" height="14" fill="url(#woodShelf)"/>
  <rect x="100" y="260" width="600" height="14" fill="url(#woodShelf)"/>
  <rect x="100" y="350" width="600" height="16" fill="url(#woodShelf)"/>

  <!-- Row 1 Books -->
  <g transform="translate(130, 95)">
    <rect x="0" y="0" width="22" height="75" fill="#ef4444" rx="2"/>
    <rect x="24" y="5" width="20" height="70" fill="#3b82f6" rx="2"/>
    <rect x="46" y="0" width="25" height="75" fill="#10b981" rx="2"/>
    <rect x="73" y="10" width="18" height="65" fill="#f59e0b" rx="2"/>
    <rect x="93" y="0" width="24" height="75" fill="#8b5cf6" rx="2"/>
    <rect x="119" y="8" width="22" height="67" fill="#ec4899" rx="2"/>
    <rect x="143" y="0" width="26" height="75" fill="#06b6d4" rx="2"/>
    <rect x="220" y="0" width="22" height="75" fill="#ef4444" rx="2"/>
    <rect x="244" y="5" width="25" height="70" fill="#10b981" rx="2"/>
    <rect x="271" y="0" width="20" height="75" fill="#f59e0b" rx="2"/>
    <rect x="340" y="0" width="28" height="75" fill="#3b82f6" rx="2"/>
    <rect x="370" y="5" width="22" height="70" fill="#8b5cf6" rx="2"/>
    <rect x="440" y="0" width="24" height="75" fill="#0284c7" rx="2"/>
    <rect x="466" y="8" width="20" height="67" fill="#15803d" rx="2"/>
    <rect x="488" y="0" width="25" height="75" fill="#d97706" rx="2"/>
  </g>

  <!-- Row 2 Books -->
  <g transform="translate(130, 185)">
    <rect x="0" y="0" width="28" height="75" fill="#0284c7" rx="2"/>
    <rect x="30" y="5" width="22" height="70" fill="#ea580c" rx="2"/>
    <rect x="54" y="0" width="26" height="75" fill="#16a34a" rx="2"/>
    <rect x="82" y="8" width="20" height="67" fill="#9333ea" rx="2"/>
    <rect x="160" y="0" width="24" height="75" fill="#f43f5e" rx="2"/>
    <rect x="186" y="5" width="26" height="70" fill="#0284c7" rx="2"/>
    <rect x="270" y="0" width="30" height="75" fill="#15803d" rx="2"/>
    <rect x="302" y="5" width="20" height="70" fill="#b45309" rx="2"/>
    <rect x="380" y="0" width="25" height="75" fill="#0891b2" rx="2"/>
    <rect x="407" y="5" width="22" height="70" fill="#e11d48" rx="2"/>
    <rect x="431" y="0" width="26" height="75" fill="#4f46e5" rx="2"/>
    <rect x="459" y="8" width="20" height="67" fill="#16a34a" rx="2"/>
    <rect x="481" y="0" width="25" height="75" fill="#d97706" rx="2"/>
  </g>

  <!-- Row 3 Books -->
  <g transform="translate(130, 275)">
    <rect x="0" y="0" width="25" height="75" fill="#dc2626" rx="2"/>
    <rect x="27" y="5" width="24" height="70" fill="#2563eb" rx="2"/>
    <rect x="53" y="0" width="28" height="75" fill="#059669" rx="2"/>
    <rect x="120" y="0" width="26" height="75" fill="#7c3aed" rx="2"/>
    <rect x="148" y="5" width="20" height="70" fill="#d97706" rx="2"/>
    <rect x="230" y="0" width="28" height="75" fill="#0284c7" rx="2"/>
    <rect x="330" y="0" width="25" height="75" fill="#16a34a" rx="2"/>
    <rect x="357" y="5" width="25" height="70" fill="#e11d48" rx="2"/>
    <rect x="430" y="0" width="30" height="75" fill="#9333ea" rx="2"/>
    <rect x="462" y="5" width="22" height="70" fill="#0284c7" rx="2"/>
    <rect x="486" y="0" width="25" height="75" fill="#ea580c" rx="2"/>
  </g>

  <!-- Large Open Book on Reading Table -->
  <g transform="translate(300, 370)">
    <polygon points="0,50 100,60 100,20 0,10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="200,50 100,60 100,20 200,10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 0,50 Q 100,75 200,50" fill="none" stroke="#92400e" stroke-width="6"/>
  </g>

  <!-- Top Title -->
  <text x="400" y="50" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#92400e" text-anchor="middle">📚 समृद्ध पुस्तकालय एवं वाचनालय (Library)</text>
  
  <!-- Bottom Caption Badge -->
  <rect x="30" y="430" width="370" height="45" rx="10" fill="rgba(15,23,42,0.85)"/>
  <text x="50" y="458" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">📖 5000+ पुस्तकों का विशाल संग्रह</text>
</svg>
