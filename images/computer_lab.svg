<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="monitorGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sleek Tech Lab Room Background -->
  <rect width="800" height="500" fill="url(#bgWall)"/>
  <!-- Ambient Cyan Glow -->
  <circle cx="400" cy="180" r="240" fill="#38bdf8" opacity="0.1"/>
  <!-- Accent Wall Stripes -->
  <line x1="0" y1="78" x2="800" y2="78" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
  <line x1="0" y1="358" x2="800" y2="358" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- Network Server Rack (Left Corner) -->
  <g filter="url(#cardShadow)">
    <rect x="34" y="106" width="88" height="248" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="44" y="122" width="68" height="24" rx="4" fill="#1e293b"/>
    <circle cx="56" cy="134" r="3.5" fill="#22c55e"/><circle cx="68" cy="134" r="3.5" fill="#38bdf8"/>
    <rect x="44" y="156" width="68" height="24" rx="4" fill="#1e293b"/>
    <circle cx="56" cy="168" r="3.5" fill="#22c55e"/><circle cx="68" cy="168" r="3.5" fill="#fbbf24"/>
    <rect x="44" y="190" width="68" height="24" rx="4" fill="#1e293b"/>
    <circle cx="56" cy="202" r="3.5" fill="#38bdf8"/><circle cx="68" cy="202" r="3.5" fill="#22c55e"/>
    <rect x="44" y="224" width="68" height="114" rx="4" fill="#1e293b" opacity="0.6"/>
  </g>

  <!-- Continuous Modern Lab Workstation Desk -->
  <rect x="0" y="356" width="800" height="22" fill="url(#deskGrad)"/>
  <rect x="0" y="378" width="800" height="122" fill="#1e293b"/>
  <rect x="28" y="394" width="744" height="88" rx="10" fill="#0f172a" opacity="0.55"/>

  <!-- Monitor 1 (Left - Coding) -->
  <g filter="url(#cardShadow)">
    <rect x="156" y="176" width="184" height="122" rx="10" fill="#020617" stroke="#475569" stroke-width="3"/>
    <rect x="164" y="184" width="168" height="102" rx="5" fill="#0f172a"/>
    <!-- Code Lines -->
    <rect x="176" y="198" width="52" height="7" rx="3" fill="#38bdf8"/>
    <rect x="234" y="198" width="38" height="7" rx="3" fill="#f472b6"/>
    <rect x="188" y="214" width="92" height="7" rx="3" fill="#4ade80"/>
    <rect x="188" y="230" width="74" height="7" rx="3" fill="#fbbf24"/>
    <rect x="188" y="246" width="108" height="7" rx="3" fill="#94a3b8"/>
    <rect x="176" y="262" width="46" height="7" rx="3" fill="#a78bfa"/>
    <!-- Stand & Keyboard -->
    <rect x="238" y="298" width="20" height="36" fill="#64748b"/>
    <rect x="212" y="330" width="72" height="8" rx="4" fill="#94a3b8"/>
    <rect x="192" y="346" width="112" height="10" rx="4" fill="#334155"/>
  </g>

  <!-- Monitor 2 (Center Hero Display - Analytics & Web) -->
  <g filter="url(#cardShadow)">
    <rect x="358" y="142" width="218" height="148" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <rect x="368" y="152" width="198" height="124" rx="6" fill="url(#monitorGlow)"/>
    <!-- Browser Chrome -->
    <rect x="378" y="162" width="178" height="16" rx="4" fill="#0f172a" opacity="0.5"/>
    <circle cx="388" cy="170" r="3" fill="#fb7185"/>
    <circle cx="398" cy="170" r="3" fill="#fbbf24"/>
    <circle cx="408" cy="170" r="3" fill="#4ade80"/>
    <!-- Dashboard Tiles -->
    <rect x="378" y="186" width="84" height="80" rx="6" fill="#ffffff" opacity="0.95"/>
    <polyline points="388,248 404,228 420,236 438,208 452,216" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="438" cy="208" r="4" fill="#16a34a"/>
    <rect x="470" y="186" width="86" height="36" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="480" y="198" width="46" height="7" rx="3" fill="#0284c7"/>
    <rect x="480" y="210" width="64" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="470" y="230" width="86" height="36" rx="6" fill="#0f172a" opacity="0.88"/>
    <text x="513" y="253" font-family="monospace" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">&lt;MDHSSS/&gt;</text>
    <!-- Stand & Keyboard -->
    <rect x="456" y="290" width="22" height="44" fill="#94a3b8"/>
    <rect x="424" y="330" width="86" height="9" rx="4" fill="#cbd5e1"/>
    <rect x="404" y="346" width="126" height="10" rx="4" fill="#475569"/>
  </g>

  <!-- Monitor 3 (Right - AI & Design) -->
  <g filter="url(#cardShadow)">
    <rect x="594" y="176" width="174" height="122" rx="10" fill="#020617" stroke="#475569" stroke-width="3"/>
    <rect x="602" y="184" width="158" height="102" rx="5" fill="#0f172a"/>
    <circle cx="654" cy="235" r="30" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="120 70"/>
    <circle cx="654" cy="235" r="18" fill="none" stroke="#4ade80" stroke-width="5" stroke-dasharray="80 50"/>
    <rect x="700" y="206" width="46" height="10" rx="4" fill="#38bdf8"/>
    <rect x="700" y="226" width="38" height="10" rx="4" fill="#a855f7"/>
    <rect x="700" y="246" width="42" height="10" rx="4" fill="#fbbf24"/>
    <!-- Stand & Keyboard -->
    <rect x="671" y="298" width="20" height="36" fill="#64748b"/>
    <rect x="646" y="330" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="626" y="346" width="110" height="10" rx="4" fill="#334155"/>
  </g>
</svg>
