<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="groundSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#groundSky)"/>
  <rect x="0" y="240" width="800" height="260" fill="url(#fieldGrad)"/>
  
  <!-- Running Track Lines -->
  <path d="M 0,260 Q 400,290 800,260" fill="none" stroke="#ef4444" stroke-width="14" opacity="0.8"/>
  <path d="M 0,285 Q 400,315 800,285" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M 0,310 Q 400,340 800,310" fill="none" stroke="#ef4444" stroke-width="14" opacity="0.8"/>
  
  <!-- Cricket & Football Gear -->
  <!-- Football -->
  <circle cx="200" cy="380" r="40" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <polygon points="200,360 215,372 210,390 190,390 185,372" fill="#0f172a"/>
  
  <!-- Cricket Bat & Wickets -->
  <g transform="translate(380, 260)">
    <!-- Wickets -->
    <rect x="80" y="40" width="8" height="90" fill="#fde047" rx="2"/>
    <rect x="95" y="40" width="8" height="90" fill="#fde047" rx="2"/>
    <rect x="110" y="40" width="8" height="90" fill="#fde047" rx="2"/>
    <rect x="76" y="35" width="48" height="6" fill="#facc15" rx="2"/>
    <!-- Bat -->
    <rect x="25" y="50" width="22" height="90" fill="#d97706" rx="4" transform="rotate(25 25 50)"/>
    <rect x="12" y="20" width="10" height="35" fill="#f8fafc" stroke="#475569" stroke-width="1" rx="2" transform="rotate(25 12 20)"/>
    <!-- Red Cricket Ball -->
    <circle cx="60" cy="140" r="16" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <path d="M 50,140 Q 60,132 70,140" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Badminton Racket -->
  <g transform="translate(580, 290)">
    <ellipse cx="60" cy="50" rx="35" ry="45" fill="none" stroke="#0284c7" stroke-width="4"/>
    <line x1="60" y1="95" x2="60" y2="160" stroke="#64748b" stroke-width="6"/>
    <rect x="56" y="140" width="8" height="30" fill="#0f172a" rx="2"/>
    <!-- Shuttlecock -->
    <polygon points="120,40 145,15 155,25" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="120" cy="40" r="8" fill="#1e293b"/>
  </g>

  <!-- Trophy Icon in Sky -->
  <g transform="translate(360, 40)">
    <path d="M 20,20 L 60,20 L 60,60 A 20,20 0 0,1 20,60 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 10,25 C 0,25 0,45 20,45" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <path d="M 70,25 C 80,25 80,45 60,45" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <rect x="35" y="60" width="10" height="20" fill="#ca8a04"/>
    <rect x="25" y="80" width="30" height="15" fill="#713f12" rx="2"/>
    <text x="40" y="48" font-size="16" font-weight="bold" fill="#713f12" text-anchor="middle">★</text>
  </g>

  <!-- Top Title -->
  <text x="400" y="140" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">🏆 खेलकूद, व्यायाम एवं शारीरिक विकास</text>
  <text x="400" y="170" font-family="'Segoe UI', sans-serif" font-size="15" fill="#475569" text-anchor="middle">क्रिकेट, कबड्डी, वॉलीबॉल, खो-खो एवं वार्षिक खेलकूद प्रतियोगिता</text>

  <!-- Bottom Caption Badge -->
  <rect x="30" y="430" width="370" height="45" rx="10" fill="rgba(15,23,42,0.85)"/>
  <text x="50" y="458" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">⚽ खेलकूद एवं शारीरिक गतिविधियां</text>
</svg>
