<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flaskLiquid2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sciBg)"/>
  <rect x="0" y="360" width="800" height="140" fill="#334155"/>
  
  <!-- Science Lab Shelf -->
  <rect x="60" y="100" width="680" height="15" fill="#0f766e" rx="3"/>
  <rect x="60" y="220" width="680" height="15" fill="#0f766e" rx="3"/>

  <!-- Chemical Flasks on Shelf -->
  <g transform="translate(100, 120)">
    <path d="M 30,0 L 40,0 L 40,30 L 60,75 A 10,10 0 0,1 55,85 L 15,85 A 10,10 0 0,1 10,75 L 30,30 Z" fill="url(#flaskLiquid)" stroke="#0369a1" stroke-width="2"/>
    <circle cx="35" cy="65" r="4" fill="#ffffff" opacity="0.7"/>
    <circle cx="45" cy="55" r="2.5" fill="#ffffff" opacity="0.7"/>
  </g>
  <g transform="translate(200, 120)">
    <rect x="25" y="10" width="20" height="75" rx="10" fill="url(#flaskLiquid2)" stroke="#9f1239" stroke-width="2"/>
    <line x1="28" y1="30" x2="35" y2="30" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="28" y1="45" x2="38" y2="45" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="28" y1="60" x2="35" y2="60" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <g transform="translate(300, 120)">
    <path d="M 30,0 L 40,0 L 40,30 L 60,75 A 10,10 0 0,1 55,85 L 15,85 A 10,10 0 0,1 10,75 L 30,30 Z" fill="#eab308" stroke="#a16207" stroke-width="2"/>
  </g>

  <!-- Microscope in Center Table -->
  <g transform="translate(480, 160)">
    <!-- Base -->
    <rect x="40" y="180" width="140" height="20" rx="5" fill="#1e293b"/>
    <!-- Arm -->
    <path d="M 150,180 C 150,100 110,60 70,70 L 65,95 C 95,85 125,115 125,180 Z" fill="#0284c7"/>
    <!-- Stage -->
    <rect x="30" y="125" width="80" height="10" rx="2" fill="#0f172a"/>
    <!-- Body Tube -->
    <rect x="35" y="40" width="25" height="75" rx="3" fill="#64748b" transform="rotate(-15 35 40)"/>
    <circle cx="45" cy="30" r="10" fill="#334155"/>
    <!-- Mirror / Lamp -->
    <circle cx="70" cy="155" r="12" fill="#fde047" stroke="#eab308" stroke-width="2"/>
  </g>

  <!-- Atomic Model Graphic -->
  <g transform="translate(180, 290)">
    <circle cx="60" cy="50" r="14" fill="#ef4444"/>
    <ellipse cx="60" cy="50" rx="45" ry="18" fill="none" stroke="#0284c7" stroke-width="2" transform="rotate(30 60 50)"/>
    <ellipse cx="60" cy="50" rx="45" ry="18" fill="none" stroke="#10b981" stroke-width="2" transform="rotate(-30 60 50)"/>
    <ellipse cx="60" cy="50" rx="45" ry="18" fill="none" stroke="#f59e0b" stroke-width="2" transform="rotate(90 60 50)"/>
  </g>

  <!-- Top Title -->
  <text x="400" y="55" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#065f46" text-anchor="middle">🔬 भौतिकी, रसायन एवं जीव विज्ञान प्रयोगशाला</text>
  <text x="400" y="85" font-family="'Segoe UI', sans-serif" font-size="15" fill="#047857" text-anchor="middle">भौतिक, रसायन एवं वनस्पति-जीव विज्ञान के व्यावहारिक प्रयोग</text>

  <!-- Bottom Caption Badge -->
  <rect x="30" y="430" width="370" height="45" rx="10" fill="rgba(15,23,42,0.85)"/>
  <text x="50" y="458" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🧪 सुसज्जित विज्ञान प्रयोगशाला (Science Lab)</text>
</svg>
