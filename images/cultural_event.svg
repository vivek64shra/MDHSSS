<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="curtainRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="spot1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Auditorium Backdrop -->
  <rect width="800" height="390" fill="url(#stageBg)"/>

  <!-- Diagonal Warm Stage Spotlights -->
  <polygon points="180,0 240,0 480,390 240,390" fill="url(#spot1)"/>
  <polygon points="560,0 620,0 560,390 320,390" fill="url(#spot1)"/>

  <!-- Festive Marigold Garland Swags -->
  <g fill="none" stroke="#f59e0b" stroke-width="5">
    <path d="M120,76 Q260,152 400,76"/>
    <path d="M400,76 Q540,152 680,76"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="170" cy="100" r="8"/><circle cx="215" cy="112" r="8"/><circle cx="260" cy="114" r="9"/>
    <circle cx="305" cy="112" r="8"/><circle cx="350" cy="100" r="8"/>
    <circle cx="450" cy="100" r="8"/><circle cx="495" cy="112" r="8"/><circle cx="540" cy="114" r="9"/>
    <circle cx="585" cy="112" r="8"/><circle cx="630" cy="100" r="8"/>
  </g>
  <g fill="#f97316">
    <circle cx="192" cy="108" r="6"/><circle cx="238" cy="114" r="6"/><circle cx="282" cy="114" r="6"/><circle cx="328" cy="108" r="6"/>
    <circle cx="472" cy="108" r="6"/><circle cx="518" cy="114" r="6"/><circle cx="562" cy="114" r="6"/><circle cx="608" cy="108" r="6"/>
  </g>

  <!-- Central Mandala Backdrop Emblem -->
  <g opacity="0.22" stroke="#fde047" fill="none">
    <circle cx="400" cy="238" r="96" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="400" cy="238" r="70" stroke-width="2"/>
    <circle cx="400" cy="238" r="44" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Polished Wooden Stage Floor -->
  <polygon points="0,390 800,390 800,500 0,500" fill="url(#stageFloor)"/>
  <rect x="0" y="384" width="800" height="12" fill="#d97706"/>
  <!-- Stage Footlights -->
  <g fill="#fef08a" opacity="0.9">
    <ellipse cx="140" cy="390" rx="18" ry="4"/><ellipse cx="270" cy="390" rx="18" ry="4"/>
    <ellipse cx="400" cy="390" rx="22" ry="5"/><ellipse cx="530" cy="390" rx="18" ry="4"/>
    <ellipse cx="660" cy="390" rx="18" ry="4"/>
  </g>

  <!-- Center Traditional Ceremonial Brass Lamp (Deep Prajwalan) -->
  <g>
    <!-- Base & Stem -->
    <ellipse cx="400" cy="382" rx="44" ry="10" fill="#b45309"/>
    <ellipse cx="400" cy="378" rx="34" ry="7" fill="#f59e0b"/>
    <rect x="394" y="262" width="12" height="116" rx="4" fill="#d97706"/>
    <ellipse cx="400" cy="322" rx="16" ry="7" fill="#fbbf24"/>
    <!-- Oil Bowl -->
    <path d="M348,262 Q400,294 452,262 L442,250 L358,250 Z" fill="#f59e0b"/>
    <ellipse cx="400" cy="252" rx="44" ry="8" fill="#fef08a"/>
    <!-- Glowing Flames -->
    <g filter="url(#glow)">
      <path d="M400,192 Q418,224 400,248 Q382,224 400,192 Z" fill="url(#flameGrad)"/>
      <path d="M364,218 Q376,236 364,252 Q352,236 364,218 Z" fill="url(#flameGrad)"/>
      <path d="M436,218 Q448,236 436,252 Q424,236 436,218 Z" fill="url(#flameGrad)"/>
    </g>
  </g>

  <!-- Left & Right Classical Stage Curtains -->
  <path d="M0,0 L168,0 Q138,160 112,260 Q94,330 68,392 L0,392 Z" fill="url(#curtainRed)"/>
  <path d="M0,0 L110,0 Q86,180 48,392 L0,392 Z" fill="#991b1b" opacity="0.65"/>
  <path d="M800,0 L632,0 Q662,160 688,260 Q706,330 732,392 L800,392 Z" fill="url(#curtainRed)"/>
  <path d="M800,0 L690,0 Q714,180 752,392 L800,392 Z" fill="#991b1b" opacity="0.65"/>
  <!-- Top Valance Drape -->
  <path d="M0,0 L800,0 L800,66 Q700,98 600,66 Q500,98 400,66 Q300,98 200,66 Q100,98 0,66 Z" fill="#991b1b"/>
  <path d="M0,62 Q100,94 200,62 Q300,94 400,62 Q500,94 600,62 Q700,94 800,62" fill="none" stroke="#fbbf24" stroke-width="4"/>

  <!-- Floating Sparkles & Celebration Confetti -->
  <g fill="#fef08a" opacity="0.88">
    <circle cx="242" cy="188" r="4"/><circle cx="286" cy="236" r="3"/><circle cx="220" cy="284" r="3.5"/>
    <circle cx="556" cy="184" r="4"/><circle cx="516" cy="232" r="3"/><circle cx="578" cy="280" r="3.5"/>
  </g>
</svg>
